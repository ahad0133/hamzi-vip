<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMZI-GPAY VIP</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Inter',sans-serif;
    background:#020617;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:#fff;
}

/* LOCK SCREEN */
.lock{
    text-align:center;
}

.lock input{
    padding:14px;
    border-radius:12px;
    border:none;
    width:250px;
    margin-bottom:10px;
}

.lock button{
    padding:12px 20px;
    border:none;
    border-radius:20px;
    background:#6366f1;
    color:#fff;
    cursor:pointer;
}

/* MAIN */
#main{
    display:none;
}

.container{max-width:420px}
.vip-card{background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);border-radius:25px;padding:20px;margin-bottom:20px}
.card-number{font-size:22px;margin:20px 0}
.form-box{background:rgba(255,255,255,0.08);padding:20px;border-radius:25px}
.field{width:100%;padding:12px;margin-bottom:10px;border-radius:10px;border:none}
.btn{width:100%;padding:12px;border:none;border-radius:20px;background:#6366f1;color:#fff}
.status{margin-top:10px;padding:10px;background:#22c55e;border-radius:10px}
</style>
</head>

<body>

<!-- 🔐 KEY SCREEN -->
<div id="lock" class="lock">
    <h2>🔑 Enter Access Key</h2>
    <input id="key" placeholder="HAMZI-XXXXXXX">
    <br>
    <button onclick="checkKey()">Unlock</button>
    <p id="msg"></p>
</div>

<!-- 💎 MAIN SITE -->
<div id="main">

<div class="container">

<div class="vip-card">
    <div>💎 HAMZI VIP</div>
    <div id="preview-card" class="card-number">**** **** **** ****</div>
    <div id="preview-exp">MM/YY</div>
</div>

<div class="form-box">

<form id="payment-form">

<input id="card" class="field" placeholder="Card Number">
<input id="month" class="field" placeholder="MM">
<input id="year" class="field" placeholder="YYYY">

<button class="btn">Add Secure Card</button>

</form>

<div id="status" class="status">Ready</div>

</div>

</div>

</div>

<script>
const BASE_URL = "https://hamzi-system.onrender.com";

/* 🔐 VERIFY KEY */
async function checkKey(){

const key=document.getElementById('key').value;

const res=await fetch(BASE_URL + '/verify-key',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({key})
});

const data=await res.json();

if(data.valid){
    document.getElementById('lock').style.display='none';
    document.getElementById('main').style.display='block';
}else{
    document.getElementById('msg').innerText="❌ Invalid or Expired Key";
}
}

/* 💳 CARD PREVIEW */
const cardInput=document.getElementById('card');
const monthInput=document.getElementById('month');
const yearInput=document.getElementById('year');

const previewCard=document.getElementById('preview-card');
const previewExp=document.getElementById('preview-exp');

cardInput.addEventListener('input',()=>{
let val=cardInput.value.replace(/\s/g,'').slice(0,16);
val=val.replace(/(.{4})/g,'$1 ').trim();
previewCard.innerText=val || "**** **** **** ****";
});

function updateExp(){
previewExp.innerText=
(monthInput.value || "MM") + "/" +
(yearInput.value ? yearInput.value.slice(2) : "YY");
}

monthInput.addEventListener('input',updateExp);
yearInput.addEventListener('input',updateExp);

/* SUBMIT */
document.getElementById('payment-form').addEventListener('submit',function(e){
e.preventDefault();
document.getElementById('status').innerText="✔ Card Added Successfully";
});
</script>

</body>
</html>
