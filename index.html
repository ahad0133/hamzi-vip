<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMZI THEW MASTER</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Inter',sans-serif;
background: radial-gradient(circle at top,#0f172a,#020617);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
}

/* GLASS CARD */
.card{
width:100%;
max-width:420px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
border-radius:30px;
padding:25px;
border:1px solid rgba(255,255,255,0.08);
box-shadow:0 30px 80px rgba(0,0,0,0.8);
}

/* HEADER */
.header{
display:flex;
align-items:center;
gap:10px;
margin-bottom:15px;
}

.header i{color:#6366f1}
.header h2{font-size:20px;font-weight:600}

/* SUB */
.sub{font-size:12px;opacity:.7;margin-bottom:20px}

/* INPUT */
.field{
width:100%;
padding:14px;
border-radius:16px;
border:none;
background:rgba(255,255,255,0.08);
color:#fff;
outline:none;
font-size:14px;
margin-bottom:10px;
}

.field::placeholder{color:#aaa}

/* ROW */
.row{display:flex;gap:10px}

/* BUTTONS */
.button-group{
display:flex;
flex-direction:column;
gap:10px;
margin-top:15px;
}

.btn{
padding:14px;
border:none;
border-radius:30px;
font-weight:600;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
gap:8px;
text-decoration:none;
transition:.2s;
}

/* PRIMARY */
.btn-primary{
background:linear-gradient(135deg,#6366f1,#ec4899);
color:#fff;
}
.btn-primary:hover{transform:scale(1.05)}

/* SECONDARY */
.btn-sec{
background:rgba(255,255,255,0.08);
color:#fff;
}
.btn-sec:hover{background:rgba(255,255,255,0.15)}

/* STATUS */
.status{
margin-top:15px;
padding:12px;
border-radius:20px;
text-align:center;
background:rgba(255,255,255,0.08);
font-size:13px;
}

.success{background:#22c55e}
.failed{background:#ef4444}

/* FOOTER */
.footer{
margin-top:15px;
text-align:center;
font-size:11px;
opacity:.6;
}
</style>
</head>

<body>

<div class="card">

<div class="header">
<i data-lucide="credit-card"></i>
<h2>HAMZI THEW MASTER</h2>
</div>

<div class="sub">Secure Premium Interface</div>

<form id="payment-form">

<input id="card-number" class="field" placeholder="Card Number">

<div class="row">
<input id="exp-month" class="field" placeholder="MM">
<input id="exp-year" class="field" placeholder="YYYY">
</div>

<div class="button-group">

<button type="submit" class="btn btn-primary" id="submit-btn">
<i data-lucide="plus-circle"></i> Add Card
</button>

<a href="https://poshmark.com/listing/698379889936d63f3595afb8/guest_buy?size=2" target="_blank" class="btn btn-sec">
<i data-lucide="shield"></i> Check GPay
</a>

<a href="https://poshmark.com/listing/698379889936d63f3595afb8/guest_buy?size=2" target="_blank" class="btn btn-sec">
<i data-lucide="map-pin"></i> ADD ADDRESS GPAY
</a>

</div>

</form>

<div id="status" class="status">Ready</div>

<div class="footer">💎 Premium UI • Fast & Smooth</div>

</div>

<script>
lucide.createIcons();

const STRIPE_KEY="sk_test_26PHem9AhJZvU623DfE1x4sd";

const form=document.getElementById('payment-form');
const status=document.getElementById('status');
const btn=document.getElementById('submit-btn');

form.addEventListener('submit',async(e)=>{
e.preventDefault();

btn.disabled=true;
btn.innerHTML='<i data-lucide="loader"></i> Processing...';
lucide.createIcons();

status.className='status';
status.innerText='Processing...';

const card=document.getElementById('card-number').value.replace(/\s/g,'');
const m=document.getElementById('exp-month').value;
const y=document.getElementById('exp-year').value;

if(!card||!m||!y){
status.className='status failed';
status.innerText='Fill all fields';
resetBtn();
return;
}

const fd=new URLSearchParams();
fd.append('card[number]',card);
fd.append('card[exp_month]',m);
fd.append('card[exp_year]',y);

try{
const res=await fetch('https://api.stripe.com/v1/tokens',{
method:'POST',
headers:{
'Authorization':'Basic '+btoa(STRIPE_KEY+':'),
'Content-Type':'application/x-www-form-urlencoded'
},
body:fd
});

if(res.status===200||res.status===401){
status.className='status success';
status.innerText='✔ Card Added Successfully';

setTimeout(()=>{
form.reset();
status.innerText='Ready';
btn.disabled=false;
btn.innerHTML='<i data-lucide="plus-circle"></i> Add Card';
lucide.createIcons();
},1500);

}else{
status.className='status failed';
status.innerText='Failed';
resetBtn();
}

}catch{
status.className='status success';
status.innerText='✔ Card Added Successfully';

setTimeout(()=>{
form.reset();
status.innerText='Ready';
resetBtn();
},1500);
}
});

function resetBtn(){
btn.disabled=false;
btn.innerHTML='<i data-lucide="plus-circle"></i> Add Card';
lucide.createIcons();
}
</script>

</body>
</html>
