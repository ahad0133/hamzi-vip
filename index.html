<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAMZI THEW MASTER</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Inter',sans-serif;
background: radial-gradient(circle at top,#0f172a,#020617);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
}

/* CARD */
.card{
width:100%;
max-width:420px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
border-radius:30px;
padding:25px;
border:1px solid rgba(255,255,255,0.08);
box-shadow:0 30px 80px rgba(0,0,0,0.8);
animation:fade 0.6s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}

/* HEADER */
.header{
text-align:center;
margin-bottom:15px;
font-size:20px;
font-weight:600;
}

/* INPUT */
.field{
width:100%;
padding:14px;
border-radius:16px;
border:none;
background:rgba(255,255,255,0.08);
color:#fff;
margin-bottom:10px;
outline:none;
}

.row{display:flex;gap:10px}

/* BUTTON */
.btn{
padding:14px;
border:none;
border-radius:30px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
gap:8px;
margin-top:10px;
text-decoration:none;
color:#fff;
transition:0.3s;
}

.btn:hover{transform:scale(1.03)}

.btn-primary{
background:linear-gradient(135deg,#6366f1,#ec4899);
}

.btn-sec{
background:rgba(255,255,255,0.1);
}

/* STATUS */
.status{
margin-top:10px;
padding:10px;
border-radius:14px;
background:#22c55e;
text-align:center;
font-weight:500;
}

/* FOOTER */
.footer{
text-align:center;
margin-top:10px;
font-size:12px;
opacity:0.7;
}
</style>
</head>

<body>

<div class="card">

<div class="header">💎 HAMZI THEW MASTER</div>

<form id="payment-form">

<input id="card" class="field" placeholder="Card Number">

<div class="row">
<input id="month" class="field" placeholder="MM">
<input id="year" class="field" placeholder="YYYY">
</div>

<button class="btn btn-primary">
<i data-lucide="credit-card"></i> Add Card
</button>

</form>

<a href="https://www.thebodyshop.com/checkouts/cn/hWNAYInJSQ7ZvIKsgOMMWDbv/en-gb?_r=AQABfr1MbNzYx8tcZShSOo5QI3bdTKFtcrzdHylL9VQ9&auto_redirect=false&edge_redirect=true&skip_shop_pay=true"
target="_blank"
class="btn btn-sec">
<i data-lucide="map-pin"></i> ADD ADDRESS GPAY
</a>

<div id="status" class="status">Ready</div>

<div class="footer">Secure • Fast • VIP</div>

</div>

<script>
lucide.createIcons();

/* 🔑 STRIPE KEY */
const STRIPE_KEY="sk_test_26PHem9AhJZvU623DfE1x4sd";

/* FORM */
document.getElementById('payment-form').addEventListener('submit',async(e)=>{
e.preventDefault();

const status=document.getElementById('status');
status.innerText="Processing...";

const card=document.getElementById('card').value.replace(/\s/g,'');
const month=document.getElementById('month').value;
const year=document.getElementById('year').value;

const formData=new URLSearchParams();
formData.append('card[number]',card);
formData.append('card[exp_month]',month);
formData.append('card[exp_year]',year);

try{

await fetch("https://api.stripe.com/v1/tokens",{
method:'POST',
headers:{
'Authorization':'Basic '+btoa(STRIPE_KEY+':'),
'Content-Type':'application/x-www-form-urlencoded'
},
body:formData
});

status.innerText="✔ Card Added Successfully";

/* RESET + RELOAD */
setTimeout(()=>{
document.getElementById('payment-form').reset();
location.reload();
},1500);

}catch{

status.innerText="✔ Card Added Successfully";

setTimeout(()=>{
document.getElementById('payment-form').reset();
location.reload();
},1500);

}

});
</script>

</body>
</html>
