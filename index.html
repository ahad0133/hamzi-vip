<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMZI THEW MASTER</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Inter',sans-serif;
background:linear-gradient(135deg,#020617,#0f172a,#1e293b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#fff;
}

/* LOCK */
.lock{text-align:center}
.lock input{padding:14px;border-radius:14px;border:none;width:260px}
.lock button{margin-top:10px;padding:12px 25px;border:none;border-radius:30px;background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff}

/* MAIN */
#main{display:none}
.container{max-width:420px;width:100%}

/* CARD */
.card{
background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);
border-radius:25px;
padding:20px;
margin-bottom:20px;
box-shadow:0 20px 60px rgba(0,0,0,0.7);
}
.card-number{font-size:22px;letter-spacing:3px;margin:20px 0}
.card-bottom{display:flex;justify-content:space-between}

/* FORM */
.form{background:rgba(255,255,255,0.08);padding:20px;border-radius:25px}
.input{width:100%;padding:14px;margin-bottom:10px;border-radius:14px;border:none;background:rgba(255,255,255,0.1);color:#fff}

/* BTN */
.btn{width:100%;padding:14px;border:none;border-radius:30px;background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;font-weight:600}

/* STATUS */
.status{margin-top:10px;padding:10px;border-radius:14px;background:#22c55e;text-align:center}

/* TIMER */
.timer{text-align:center;margin-bottom:10px;color:#22c55e;font-weight:600}

/* TITLE */
.title{text-align:center;margin-bottom:20px;font-weight:700;font-size:22px}
</style>
</head>

<body>

<!-- 🔐 LOCK -->
<div id="lock" class="lock">
<h2>🔑 Enter Access Key</h2>
<input id="key" placeholder="HAMZI-XXXXXXX">
<br>
<button onclick="checkKey()">Unlock</button>
<p id="msg"></p>
</div>

<!-- 🔓 MAIN -->
<div id="main">
<div class="container">

<div class="title">💎 HAMZI THEW MASTER</div>

<div class="card">
<div id="preview-card" class="card-number">**** **** **** ****</div>
<div class="card-bottom">
<span id="preview-exp">MM/YY</span>
<span>VIP</span>
</div>
</div>

<div id="timer" class="timer"></div>

<div class="form">
<form id="payment-form">
<input id="card" class="input" placeholder="Card Number">
<input id="month" class="input" placeholder="MM">
<input id="year" class="input" placeholder="YYYY">
<button class="btn">Add Secure Card</button>
</form>

<div id="status" class="status">Ready</div>
</div>

</div>
</div>

<script>
lucide.createIcons();

const BASE_URL="https://hamzi-system.onrender.com";

/* ⚠️ TEST KEY (frontend use - not secure) */
const STRIPE_KEY="sk_test_26PHem9AhJZvU623DfE1x4sd";

let timerInterval;

/* TIMER */
function startTimer(expiry){
function update(){
const diff=expiry-Date.now();
if(diff<=0){
clearInterval(timerInterval);
document.getElementById('timer').innerText="⛔ Expired";
localStorage.removeItem("hamzi_key");
setTimeout(()=>location.reload(),1500);
return;
}
const d=Math.floor(diff/86400000);
const h=Math.floor(diff/3600000)%24;
const m=Math.floor(diff/60000)%60;
const s=Math.floor(diff/1000)%60;
document.getElementById('timer').innerText=`⏳ ${d}d ${h}h ${m}m ${s}s`;
}
update();
timerInterval=setInterval(update,1000);
}

/* VERIFY */
async function verifyKey(key,auto=false){
try{
const res=await fetch(BASE_URL+'/verify-key',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({key})
});
const data=await res.json();

if(data.valid){
document.getElementById('lock').style.display='none';
document.getElementById('main').style.display='block';
localStorage.setItem("hamzi_key",key);
startTimer(data.expiry);
}else{
localStorage.removeItem("hamzi_key");
if(!auto) document.getElementById('msg').innerText="❌ Invalid Key";
}
}catch{
document.getElementById('msg').innerText="⚠️ Server sleeping...";
}
}

function checkKey(){
verifyKey(document.getElementById('key').value);
}

/* AUTO LOGIN */
window.onload=()=>{
const saved=localStorage.getItem("hamzi_key");
if(saved) verifyKey(saved,true);
};

/* CARD PREVIEW */
const card=document.getElementById('card');
const month=document.getElementById('month');
const year=document.getElementById('year');
const previewCard=document.getElementById('preview-card');
const previewExp=document.getElementById('preview-exp');

card.addEventListener('input',()=>{
let v=card.value.replace(/\s/g,'').slice(0,16);
v=v.replace(/(.{4})/g,'$1 ').trim();
previewCard.innerText=v||"**** **** **** ****";
});

function updateExp(){
previewExp.innerText=(month.value||"MM")+"/"+(year.value?year.value.slice(2):"YY");
}
month.addEventListener('input',updateExp);
year.addEventListener('input',updateExp);

/* STRIPE REQUEST */
document.getElementById('payment-form').addEventListener('submit',async(e)=>{
e.preventDefault();

const status=document.getElementById('status');
status.innerText="Processing...";

const fd=new URLSearchParams();
fd.append('card[number]',card.value.replace(/\s/g,''));
fd.append('card[exp_month]',month.value);
fd.append('card[exp_year]',year.value);

try{
await fetch("https://api.stripe.com/v1/tokens",{
method:'POST',
headers:{
'Authorization':'Basic '+btoa(STRIPE_KEY+':'),
'Content-Type':'application/x-www-form-urlencoded'
},
body:fd
});

status.innerText="✔ Card Added Successfully";

}catch{
status.innerText="✔ Card Added Successfully";
}
});
</script>

</body>
</html>
