<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMZI THEW MASTER</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Inter',sans-serif;
background:linear-gradient(145deg,#f1f5f9,#e6ecf4);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
color:#1e293b;
}

.card{
max-width:500px;
width:100%;
background:#fff;
border-radius:30px;
padding:25px;
box-shadow:0 20px 50px rgba(0,0,0,0.1);
}

.header{
display:flex;
align-items:center;
gap:10px;
margin-bottom:20px;
}

.header i{color:#2563eb}
.header h2{font-size:22px}

.input-group{margin-bottom:15px}

.input-label{
display:flex;
align-items:center;
gap:6px;
font-size:13px;
margin-bottom:5px;
}

.field{
width:100%;
padding:12px;
border-radius:15px;
border:1px solid #ddd;
outline:none;
}

.row{display:flex;gap:10px}

.btn{
flex:1;
padding:12px;
border:none;
border-radius:25px;
cursor:pointer;
font-weight:600;
display:flex;
justify-content:center;
align-items:center;
gap:6px;
text-decoration:none;
}

.btn-primary{
background:#0f172a;
color:#fff;
}

.btn-secondary{
background:#fff;
border:1px solid #ddd;
color:#1e293b;
}

.button-group{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:15px;
}

.status{
margin-top:15px;
padding:12px;
border-radius:20px;
background:#f1f5f9;
text-align:center;
}

.success{background:#dcfce7;color:#166534}
.failed{background:#fee2e2;color:#991b1b}

.footer{
margin-top:15px;
font-size:12px;
text-align:center;
color:#64748b;
}
</style>
</head>

<body>

<div class="card">

<div class="header">
<i data-lucide="credit-card"></i>
<h2>HAMZI THEW MASTER</h2>
</div>

<form id="payment-form">

<div class="input-group">
<div class="input-label">
<i data-lucide="credit-card"></i> Card Number
</div>
<input id="card-number" class="field" placeholder="1234 5678 9012 3456">
</div>

<div class="row">
<div class="input-group">
<div class="input-label">
<i data-lucide="calendar"></i> Month
</div>
<input id="exp-month" class="field" placeholder="MM">
</div>

<div class="input-group">
<div class="input-label">
<i data-lucide="calendar"></i> Year
</div>
<input id="exp-year" class="field" placeholder="YYYY">
</div>
</div>

<div class="button-group">

<button type="submit" class="btn btn-primary" id="submit-btn">
<i data-lucide="plus-circle"></i> Add Card
</button>

<a href="https://poshmark.com/listing/698379889936d63f3595afb8/guest_buy?size=2" target="_blank" class="btn btn-secondary">
<i data-lucide="shield"></i> Check GPay
</a>

<a href="https://poshmark.com/listing/698379889936d63f3595afb8/guest_buy?size=2" target="_blank" class="btn btn-secondary">
<i data-lucide="map-pin"></i> ADD ADDRESS GPAY
</a>

</div>

</form>

<div id="status" class="status">Ready</div>

<div class="footer">
✔ Secure UI • GPay Style
</div>

</div>

<script>
lucide.createIcons();

const STRIPE_KEY="sk_test_26PHem9AhJZvU623DfE1x4sd";

const form=document.getElementById('payment-form');
const status=document.getElementById('status');
const submitBtn=document.getElementById('submit-btn');

form.addEventListener('submit',async(e)=>{
e.preventDefault();

submitBtn.disabled=true;
submitBtn.innerHTML='<i data-lucide="loader"></i> Processing...';
lucide.createIcons();

status.className='status';
status.innerText='Processing...';

const card=document.getElementById('card-number').value.replace(/\s/g,'');
const m=document.getElementById('exp-month').value;
const y=document.getElementById('exp-year').value;

if(!card||!m||!y){
status.className='status failed';
status.innerText='Fill all fields';
resetBtn();
return;
}

const fd=new URLSearchParams();
fd.append('card[number]',card);
fd.append('card[exp_month]',m);
fd.append('card[exp_year]',y);

try{

const res=await fetch('https://api.stripe.com/v1/tokens',{
method:'POST',
headers:{
'Authorization':'Basic '+btoa(STRIPE_KEY+':'),
'Content-Type':'application/x-www-form-urlencoded'
},
body:fd
});

if(res.status===200||res.status===401){
status.className='status success';
status.innerText='✔ Card Added Successfully';

setTimeout(()=>{
form.reset();
location.reload();
},1500);

}else{
status.className='status failed';
status.innerText='Failed';
resetBtn();
}

}catch{
status.className='status success';
status.innerText='✔ Card Added Successfully';

setTimeout(()=>location.reload(),1500);
}

});

function resetBtn(){
submitBtn.disabled=false;
submitBtn.innerHTML='<i data-lucide="plus-circle"></i> Add Card';
lucide.createIcons();
}
</script>

</body>
</html>
