<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pixelchk gpay auth</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
body{
font-family:'Inter',sans-serif;
background:linear-gradient(145deg,#f1f5f9,#e6ecf4);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

/* LOCK */
.lock{text-align:center}
.lock input{padding:12px;border-radius:12px;border:1px solid #ccc;width:250px}
.lock button{padding:10px 20px;border:none;border-radius:20px;background:#2563eb;color:#fff}

/* MAIN */
#main{display:none}

.card{max-width:500px;background:#fff;padding:20px;border-radius:20px}

.field{width:100%;padding:12px;margin:10px 0;border-radius:10px;border:1px solid #ddd}

.btn{padding:10px;border:none;border-radius:20px;background:#111;color:#fff;width:100%}

.status{margin-top:10px;padding:10px;border-radius:10px;background:#f1f5f9}

.timer{margin-top:10px;font-weight:bold;color:#16a34a;text-align:center}
</style>
</head>

<body>

<!-- 🔐 LOCK -->
<div id="lock" class="lock">
<h2>🔑 Enter Key</h2>
<input id="key" placeholder="HAMZI-XXXXXXX">
<br><br>
<button onclick="checkKey()">Unlock</button>
<p id="msg"></p>
</div>

<!-- 🔓 MAIN -->
<div id="main">

<div class="card">

<h2>pixelchk gpay auth</h2>

<div id="timer" class="timer"></div>

<form id="payment-form">
<input id="card-number" class="field" placeholder="Card Number">
<input id="exp-month" class="field" placeholder="MM">
<input id="exp-year" class="field" placeholder="YYYY">
<button class="btn">Add Card</button>
</form>

<div id="status" class="status">Ready</div>

</div>

</div>

<script>
lucide.createIcons();

const BASE_URL = "https://hamzi-system.onrender.com";

let timerInterval;

/* ⏳ TIMER */
function startTimer(expiry){

function update(){
const now = Date.now();
const diff = expiry - now;

if(diff <= 0){
clearInterval(timerInterval);
document.getElementById('timer').innerText="⛔ Key Expired";

localStorage.removeItem("hamzi_key");
setTimeout(()=>location.reload(),1500);
return;
}

const d=Math.floor(diff/(1000*60*60*24));
const h=Math.floor((diff/(1000*60*60))%24);
const m=Math.floor((diff/(1000*60))%60);
const s=Math.floor((diff/1000)%60);

document.getElementById('timer').innerText =
`⏳ ${d}d ${h}h ${m}m ${s}s`;
}

update();
timerInterval=setInterval(update,1000);
}

/* 🔐 VERIFY */
async function verifyKey(key,auto=false){

try{
const res=await fetch(BASE_URL+'/verify-key',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({key})
});

const data=await res.json();

if(data.valid){

document.getElementById('lock').style.display='none';
document.getElementById('main').style.display='block';

localStorage.setItem("hamzi_key",key);

/* START TIMER */
startTimer(data.expiry);

}else{
localStorage.removeItem("hamzi_key");
if(!auto) document.getElementById('msg').innerText="❌ Invalid Key";
}

}catch{
document.getElementById('msg').innerText="⚠️ Server sleeping...";
}
}

/* CLICK */
function checkKey(){
const key=document.getElementById('key').value;
verifyKey(key);
}

/* AUTO LOGIN */
window.onload=()=>{
const saved=localStorage.getItem("hamzi_key");
if(saved) verifyKey(saved,true);
};

/* FORM */
document.getElementById('payment-form').addEventListener('submit',function(e){
e.preventDefault();
document.getElementById('status').innerText="✔ Card Added Successfully";
});
</script>

</body>
</html>
