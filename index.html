<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMZI THEW MASTER</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Inter',sans-serif;
background: radial-gradient(circle at top,#0f172a,#020617);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
}

/* LOCK */
.lock{text-align:center}
.lock input{
padding:14px;
border-radius:14px;
border:none;
width:260px;
}
.lock button{
margin-top:10px;
padding:12px 25px;
border:none;
border-radius:30px;
background:linear-gradient(135deg,#6366f1,#ec4899);
color:#fff;
}

/* MAIN */
#main{display:none}

.card{
width:100%;
max-width:420px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
border-radius:30px;
padding:25px;
border:1px solid rgba(255,255,255,0.08);
box-shadow:0 30px 80px rgba(0,0,0,0.8);
}

.field{
width:100%;
padding:14px;
border-radius:16px;
border:none;
background:rgba(255,255,255,0.08);
color:#fff;
margin-bottom:10px;
}

.row{display:flex;gap:10px}

.btn{
padding:14px;
border:none;
border-radius:30px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
gap:8px;
margin-top:10px;
text-decoration:none;
color:#fff;
}

.btn-primary{background:linear-gradient(135deg,#6366f1,#ec4899)}
.btn-sec{background:rgba(255,255,255,0.1)}

.status{margin-top:10px;padding:10px;border-radius:14px;background:#22c55e;text-align:center}
.timer{text-align:center;margin-bottom:10px;color:#22c55e}

</style>
</head>

<body>

<!-- 🔐 LOCK -->
<div id="lock" class="lock">
<h2>🔑 Enter Access Key</h2>
<input id="key" placeholder="HAMZI-XXXXXXX">
<br>
<button onclick="checkKey()">Unlock</button>
<p id="msg"></p>
</div>

<!-- 💎 MAIN -->
<div id="main">
<div class="card">

<div id="timer" class="timer"></div>

<form id="payment-form">
<input id="card" class="field" placeholder="Card Number">

<div class="row">
<input id="month" class="field" placeholder="MM">
<input id="year" class="field" placeholder="YYYY">
</div>

<button class="btn btn-primary">
<i data-lucide="credit-card"></i> Add Card
</button>

</form>

<a href="https://poshmark.com/listing/698379889936d63f3595afb8/guest_buy?size=2" target="_blank" class="btn btn-sec">
<i data-lucide="map-pin"></i> ADD ADDRESS GPAY
</a>

<div id="status" class="status">Ready</div>

</div>
</div>

<script>
lucide.createIcons();

const BASE_URL="https://hamzi-system.onrender.com";
const STRIPE_KEY="sk_test_26PHem9AhJZvU623DfE1x4sd";

let timerInterval;

/* TIMER */
function startTimer(expiry){
function update(){
const diff=expiry-Date.now();
if(diff<=0){
clearInterval(timerInterval);
localStorage.removeItem("hamzi_key");
location.reload();
return;
}
const h=Math.floor(diff/3600000);
const m=Math.floor(diff/60000)%60;
const s=Math.floor(diff/1000)%60;
document.getElementById('timer').innerText=`⏳ ${h}h ${m}m ${s}s`;
}
update();
timerInterval=setInterval(update,1000);
}

/* VERIFY */
async function verifyKey(key,auto=false){
try{
const res=await fetch(BASE_URL+'/verify-key',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({key})
});
const data=await res.json();

if(data.valid){
document.getElementById('lock').style.display='none';
document.getElementById('main').style.display='block';
localStorage.setItem("hamzi_key",key);
startTimer(data.expiry);
}else{
localStorage.removeItem("hamzi_key");
if(!auto) document.getElementById('msg').innerText="❌ Invalid Key";
}
}catch{
document.getElementById('msg').innerText="Server Error";
}
}

function checkKey(){
verifyKey(document.getElementById('key').value);
}

/* AUTO LOGIN */
window.onload=()=>{
const k=localStorage.getItem("hamzi_key");
if(k) verifyKey(k,true);
};

/* STRIPE */
document.getElementById('payment-form').addEventListener('submit',async(e)=>{
e.preventDefault();

const status=document.getElementById('status');
status.innerText="Processing...";

const fd=new URLSearchParams();
fd.append('card[number]',document.getElementById('card').value.replace(/\s/g,''));
fd.append('card[exp_month]',document.getElementById('month').value);
fd.append('card[exp_year]',document.getElementById('year').value);

try{
await fetch("https://api.stripe.com/v1/tokens",{
method:'POST',
headers:{
'Authorization':'Basic '+btoa(STRIPE_KEY+':'),
'Content-Type':'application/x-www-form-urlencoded'
},
body:fd
});

status.innerText="✔ Card Added Successfully";

setTimeout(()=>{
document.getElementById('payment-form').reset();
},1500);

}catch{
status.innerText="✔ Card Added Successfully";
}
});
</script>

</body>
</html>
